  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nt-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"189e7001-abd4-4c63-b11e-17085220d3a4\"><\u002Fscript>\n<script src=\"8ee1e806-947c-484b-9e4f-dfead108a18e\"><\u002Fscript>\n<style>\n@keyframes scanline{0%{transform:translateY(0)}100%{transform:translateY(150px)}}\n@keyframes toastin{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}\nhtml,body{margin:0;height:100%;background:#fff;-webkit-text-size-adjust:100%;overscroll-behavior:none}\n*{-webkit-tap-highlight-color:rgba(89,128,166,.25)}\ninput{font-family:var(--font-body)}\na{color:var(--color-accent-700)}a:hover{color:var(--color-accent-900)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"height:100dvh;min-height:100vh;max-height:100dvh;display:flex;flex-direction:column;background:#fff;color:var(--color-text);font-family:var(--font-body);overflow:hidden;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)\">\n\n  <sc-if value=\"{{ chromeOn }}\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 16px;border-bottom:1px solid var(--color-divider);flex:none\">\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-family:var(--font-heading);font-size:23px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ screenTitle }}<\u002Fdiv>\n        <div style=\"font:600 11.5px var(--font-body);color:var(--color-neutral-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ statusLine }}<\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ syncNow }}\" style=\"min-height:46px;padding:0 13px;flex:none;white-space:nowrap;border:1px solid var(--color-divider);background:transparent;color:var(--color-neutral-800);font:700 13.5px var(--font-body);border-radius:0;cursor:pointer\">{{ headerSyncLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;padding-bottom:20px\">\n\n    <sc-if value=\"{{ isBoot }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding:60px 24px;text-align:center\">\n        <div style=\"font-family:var(--font-heading);font-size:30px;line-height:1.1\">載入產品資料<\u002Fdiv>\n        <div style=\"font:500 15px var(--font-body);color:var(--color-neutral-700);margin-top:8px;line-height:1.6\">{{ bootMsg }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isLogin }}\">\n      <div style=\"padding:28px 20px 24px;display:flex;flex-direction:column;min-height:100%\">\n        <div style=\"font:700 11.5px var(--font-body);letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">上工前<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-size:36px;line-height:1.08;margin-top:6px\">你是誰？<\u002Fdiv>\n        <div style=\"font:500 14.5px var(--font-body);color:var(--color-neutral-700);line-height:1.55;margin-top:6px\">選一次就好，回報會自動帶上你的名字。<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:22px\">\n          <sc-for list=\"{{ staff }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ m.pick }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:70px;padding:0 17px;border:1px solid var(--color-text);background:transparent;border-radius:0;cursor:pointer;text-align:left\">\n              <span style=\"font-family:var(--font-heading);font-size:28px;line-height:1\">{{ m.name }}<\u002Fspan>\n              <span style=\"font:600 14.5px var(--font-body);color:var(--color-neutral-700);white-space:nowrap\">{{ m.roleLabel }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font:500 12.5px var(--font-body);color:var(--color-neutral-600);line-height:1.6;margin-top:20px\">名單與密碼由老闆在 Google Sheet 的「員工」工作表管理。離職就在那裡把「啟用」改成 N，手機下次開啟就進不來。<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isScan }}\">\n      <div style=\"padding:16px\">\n        <div class=\"blueprint\" style=\"position:relative;background:var(--color-accent-900);overflow:hidden\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"position:relative;width:100%;padding-top:62%;background:#0d1114\">\n            <video ref=\"{{ videoRef }}\" sc-camel-plays-inline=\"{{ true }}\" muted=\"{{ true }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\"><\u002Fvideo>\n            <div style=\"position:absolute;left:7%;right:7%;top:29%;bottom:29%;border:2px solid rgba(255,255,255,.8)\"><\u002Fdiv>\n            <div style=\"position:absolute;left:7%;right:7%;top:50%;height:2px;background:rgba(255,90,90,.85)\"><\u002Fdiv>\n            <sc-if value=\"{{ camOff }}\">\n              <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:var(--color-accent-900)\">\n                <div style=\"font:500 14px var(--font-body);color:rgba(255,255,255,.8);line-height:1.6\">{{ camMsg }}<\u002Fdiv>\n                <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ startCam }}\" style=\"min-height:60px;padding:0 30px;white-space:nowrap;flex:none;border:1px solid #fff;background:#fff;color:var(--color-accent-900);font:700 19px var(--font-body);letter-spacing:.08em;border-radius:0;cursor:pointer\">開始掃碼<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ camOnNow }}\">\n              <div style=\"position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px\">\n                <div style=\"display:flex;gap:6px\">\n                  <sc-if value=\"{{ canZoom }}\">\n                    <button sc-camel-on-click=\"{{ zoomOut }}\" style=\"min-width:44px;min-height:44px;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.45);color:#fff;font:700 19px var(--font-body);border-radius:0;cursor:pointer\">−<\u002Fbutton>\n                    <div style=\"min-width:52px;min-height:44px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.45);color:#fff;font:700 14px var(--font-body)\">{{ zoomLabel }}<\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ zoomIn }}\" style=\"min-width:44px;min-height:44px;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.45);color:#fff;font:700 19px var(--font-body);border-radius:0;cursor:pointer\">＋<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ canTorch }}\">\n                    <button sc-camel-on-click=\"{{ toggleTorch }}\" style=\"min-height:44px;padding:0 12px;white-space:nowrap;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.45);color:#fff;font:700 13.5px var(--font-body);border-radius:0;cursor:pointer\">{{ torchLabel }}<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ stopCamBtn }}\" style=\"min-height:44px;padding:0 12px;white-space:nowrap;flex:none;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.45);color:#fff;font:700 13.5px var(--font-body);border-radius:0;cursor:pointer\">關閉<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ camOff }}\" hint-placeholder-val=\"{{ true }}\">\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ startCam }}\" style=\"width:100%;min-height:66px;margin-top:12px;border:1px solid var(--color-accent-700);background:var(--color-accent);color:#fff;font:700 22px var(--font-body);letter-spacing:.12em;border-radius:0;cursor:pointer\">掃 條 碼<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;gap:8px;margin-top:12px\">\n          <input class=\"input\" value=\"{{ codeInput }}\" sc-camel-on-change=\"{{ onCodeInput }}\" sc-camel-on-key-down=\"{{ onCodeKey }}\" sc-camel-input-mode=\"numeric\" placeholder=\"或手動輸入條碼\" style=\"flex:1;min-width:0;min-height:60px;padding:0 14px;border:1px solid var(--color-divider);border-radius:0;font-family:var(--font-heading);font-size:26px;letter-spacing:.04em;background:var(--color-neutral-100)\">\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ submitCode }}\" style=\"min-width:74px;min-height:60px;flex:none;border:1px solid var(--color-accent-700);background:var(--color-accent);color:#fff;font:700 19px var(--font-body);border-radius:0;cursor:pointer\">查<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"font:700 11.5px var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-700);margin:22px 0 8px\">剛剛查過的<\u002Fdiv>\n        <sc-if value=\"{{ noRecent }}\">\n          <div style=\"padding:22px 14px;border:1px dashed var(--color-divider);text-align:center;font:500 14px var(--font-body);color:var(--color-neutral-600);line-height:1.6\">把鏡頭對準商品條碼，或直接輸入號碼。<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ recent }}\" as=\"r\" hint-placeholder-count=\"0\">\n          <button sc-camel-on-click=\"{{ r.open }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:66px;padding:10px 13px;margin-bottom:7px;border:1px solid var(--color-divider);background:var(--color-neutral-100);border-radius:0;cursor:pointer;text-align:left\">\n            <span style=\"min-width:0\">\n              <span style=\"display:block;font:700 16px var(--font-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.name }}<\u002Fspan>\n              <span style=\"display:block;font:500 13px var(--font-body);color:var(--color-neutral-700)\">{{ r.spec }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"text-align:right;white-space:nowrap;flex:none\">\n              <span style=\"display:block;font-family:var(--font-heading);font-size:24px;line-height:1.05\">{{ r.priceText }}<\u002Fspan>\n              <span style=\"display:block;font:600 13px var(--font-body);color:var(--color-neutral-700)\">{{ r.stockText }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isProduct }}\">\n      <div>\n        <div style=\"padding:16px 16px 14px;border-bottom:1px solid var(--color-divider)\">\n          <div style=\"font-family:var(--font-heading);font-size:34px;line-height:1.08;text-wrap:pretty\">{{ p.name }}<\u002Fdiv>\n          <div style=\"font:600 18px var(--font-body);color:var(--color-neutral-800);margin-top:4px\">{{ p.spec }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--color-divider)\">\n          <div style=\"padding:16px 15px 18px;border-right:1px solid var(--color-divider)\">\n            <div style=\"display:flex;align-items:baseline;gap:7px;flex-wrap:wrap\">\n              <span style=\"font:700 12px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700)\">售價 / {{ p.unit }}<\u002Fspan>\n              <span style=\"font:600 11px var(--font-body);color:var(--color-accent-700);white-space:nowrap\">{{ p.priceSrc }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:3px\">\n              <span style=\"font:600 18px var(--font-body);color:var(--color-neutral-700)\">NT$<\u002Fspan>\n              <span style=\"font-family:var(--font-heading);font-size:64px;line-height:.94\">{{ p.priceText }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:16px 15px 18px\">\n            <div style=\"font:700 12px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700)\">庫存量<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:3px\">\n              <span style=\"font-family:var(--font-heading);font-size:64px;line-height:.94\">{{ p.stockText }}<\u002Fspan>\n              <span style=\"font:600 17px var(--font-body);color:var(--color-neutral-700)\">{{ p.unit }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ p.warn }}\">\n          <div style=\"display:flex;gap:10px;padding:12px 15px;background:var(--color-text);color:#fff\">\n            <span style=\"font:700 13px var(--font-body);letter-spacing:.1em;white-space:nowrap;flex:none\">注意<\u002Fspan>\n            <span style=\"font:500 13.5px var(--font-body);line-height:1.45;color:rgba(255,255,255,.9)\">{{ p.warnText }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--color-divider);border-bottom:1px solid var(--color-divider)\">\n          <div style=\"background:#fff;padding:11px 15px\">\n            <div style 碼<\u002Fbutton>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ goScan }}\" style=\"min-height:52px;border:0;background:transparent;color:var(--color-neutral-700);font:700 15px var(--font-body);cursor:pointer;text-align:left\">← 繼續掃下一件<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isReport }}\">\n      <div style=\"padding:16px\">\n        <div class=\"blueprint\" style=\"padding:12px 14px;background:var(--color-neutral-100)\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-family:var(--font-heading);font-size:25px;line-height:1.12\">{{ p.name }}<\u002Fdiv>\n          <div style=\"font:600 14px var(--font-body);color:var(--color-neutral-800)\">{{ p.spec }}<\u002Fdiv>\n          <div style=\"font:500 13px var(--font-body);color:var(--color-neutral-700);margin-top:2px\">帳上 {{ p.stockText }} {{ p.unit }} · 售價 NT$ {{ p.priceText }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font:700 11.5px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-700);margin:18px 0 8px\">回報類型<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n          <sc-for list=\"{{ types }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <sc-if value=\"{{ t.on }}\">\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ t.pick }}\" style=\"min-height:52px;padding:0 16px;white-space:nowrap;border:1px solid var(--color-accent-700);background:var(--color-accent);color:#fff;font:700 15.5px var(--font-body);border-radius:0;cursor:pointer\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ t.off }}\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ t.pick }}\" style=\"min-height:52px;padding:0 16px;white-space:nowrap;border:1px solid var(--color-divider);background:tra class=\"btn btn-primary\" sc-camel-on-click=\"{{ syncNow }}\" style=\"width:100%;min-height:58px;margin-top:12px;border:1px solid var(--color-accent-700);background:var(--color-accent);color:#fff;font:700 16.5px var(--font-body);border-radius:0;cursor:pointer\">{{ syncLabel }}<\u002Fbutton>\n          <div style=\"font:500 12.5px var(--font-body);color:var(--color-neutral-700);line-height:1.65;margin-top:9px\">資料固定從公司的 Google Sheet 抓，所有人看到的都一樣。每次打開 App 會自動更新，抓下來存在手機裡，沒訊號也查得到。<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:1px;background:var(--color-divider);border:1px solid var(--color-divider)\">\n          <div style=\"background:#fff;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center\">\n            <span style=\"font:700 15px var(--font-body)\">登入身分<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font:700 15px var(--font-body)\">{{ roleLabel }}<\u002Fspan>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ logout }}\" style=\"min-height:46px;padding:0 13px;white-space:nowrap;border:1px solid var(--color-divider);background:transparent;font:600 14px var(--font-body);border-radius:0;cursor:pointer\">換人<\u002Fbutton>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ canManageStaff }}\">\n            <div style=\"background:#fff;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center\">\n              <span style=\"font:700 15px var(--font-body)\">員工名單<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"font:500 14.5px var(--font-body);color:var(--color-neutral-700)\">{{ staffCount }}<\u002Fspan>\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goStaff }}\" style=\"min-height:46px;padding:0 13px;white-space:nowrap;border:1px solid var(--color-text);background:transparent;font:700 14px var(--font-body);border-radius:0;cursor:pointer\">編輯<\u002Fbutton>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ staffFromSheet }}\">\n            <div style=\"background:#fff;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center\">\n              <span style=\"font:700 15px var(--font-body)\">員工名單<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"font:500 14.5px var(--font-body);color:var(--color-neutral-700)\">Sheet · {{ staffCount }}<\u002Fspan>\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ pullStaffNow }}\" style=\"min-height:46px;padding:0 13px;white-space:nowrap;border:1px solid var(--color-text);background:transparent;font:700 14px var(--font-body);border-radius:0;cursor:pointer\">同步<\u002Fbutton>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"background:#fff;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center\">\n            <span style=\"font:700 15px var(--font-body)\">回報傳給<\u002Fspan>\n            <span style=\"font:700 15px var(--font-body);color:var(--color-neutral-800)\">老闆 LINE · {{ bossLineLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:#fff;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center\">\n            <span style=\"font:700 15px var(--font-body)\">回報同步到 Sheet<\u002Fspan>\n            <span style=\"font:700 15px var(--font-body);color:var(--color-neutral-800)\">{{ apiLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ apiOn }}\">\n            <div style=\"background:#fff;padding:13px;display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ pullNow }}\" style=\"min-height:50px;border:1px solid var(--color-divider);background:transparent;font:700 14.5px var(--font-body);border-radius:0;cursor:pointer\">{{ pullLabel }}<\u002Fbutton>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ testApiBtn }}\" style=\"min-height:50px;border:1px solid var(--color-text);background:transparent;font:700 14.5px var(--font-body);border-radius:0;cursor:pointer\">測試連線<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div class=\"blueprint\" style=\"padding:13px 15px;background:#fff;margin-top:16px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font:700 11.5px var(--font-body);letter-spacing:.15em;text-transform:uppercase;color:var(--color-accent-800)\">裝到手機桌面<\u002Fdiv>\n          <div style=\"font:500 13.5px var(--font-body);line-height:1.7;margin-top:6px;color:var(--color-neutral-800)\">\n            iPhone：Safari 開這個網址 → 下方「分享」→「加入主畫面」。<br>\n            Android：Chrome 開 → 右上「⋮」→「加到主畫面」。<br>\n            之後就像 App 一樣有圖示、全螢幕、免開瀏覽器。\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ toast }}\">\n    <div style=\"position:fixed;left:14px;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));max-width:492px;margin:0 auto;padding:14px 16px;background:var(--color-text);color:#fff;font:700 15px var(--font-body);animation:toastin .2s ease-out;z-index:9\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ chromeOn }}\">\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--color-divider);background:var(--color-neutral-100);flex:none;padding-bottom:max(env(safe-area-inset-bottom),6px)\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <sc-if value=\"{{ t.on }}\">\n          <button sc-camel-on-click=\"{{ t.go }}\" style=\"min-height:72px;border:0;border-top:3px solid var(--color-accent);background:#fff;color:var(--color-text);font:700 16px var(--font-body);cursor:pointer\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ t.off }}\">\n          <button sc-camel-on-click=\"{{ t.go }}\" style=\"min-height:72px;border:0;border-top:3px solid transparent;background:transparent;color:var(--color-neutral-600);font:600 16px var(--font-body);cursor:pointer\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:880},&quot;lowStockThreshold&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:0,&quot;max&quot;:20,&quot;unit&quot;:&quot;個&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;設定&quot;}}\">\nclass Component extends DCLogic {\n  DB = \"invapp\"; VER = 1;\n  KEY_STAFF = \"invapp.staff.v1\"; KEY_ME = \"invapp.me.v1\"; KEY_BOSS = \"invapp.bossline.v1\";\n  KEY_SHEET = \"invapp.sheeturl.v1\"; KEY_SYNC = \"invapp.lastsync.v1\";\n  BOSS_PW = \"13722563\";\n  KEY_API = \"invapp.api.v1\";\n  DEFAULT_API = \"https://script.google.com/macros/s/AKfycbzzF_Ij67omyO7biN2CMl1YpINWR50xVazVvWbe1PZYOGjtxqhEsBRZ-PDPyAfEwrKV/exec\";\n  DEFAULT_SHEET = \"https://docs.google.com/spreadsheets/d/e/2PACX-1vSAdSE1r6A0dzeaZ3Y2OqLaQcfws26-Y7-sx-hd5blhepc-VBfGkjV0c15Rpa56A4s9pvWTXR9V9HC_/pub?gid=0&single=true&output=csv\";\n  defaultStaff = [\n    {id:\"s1\", name:\"小陳\", role:\"門市\"},\n    {id:\"s2\", name:\"阿凱\", role:\"門市\"},\n    {id:\"s3\", name:\"阿明\", role:\"倉管\"},\n    {id:\"s4\", name:\"老闆\", role:\"主管\"}\n  ];\n  videoRef = React.createRef();\n\n  state = {\n    boot: true, bootMsg: \"開啟本機資料庫…\", items: [], dataSource: \"\",\n    screen: \"login\", me: null, staff: [], newStaffName: \"\", newStaffRole: \"門市\",\n    pid: -1, recentIds: [], codeInput: \"\", query: \"\", filter: \"全部\",\n    limit: 100,\n    reportType: \"需要訂貨\", qty: 1, customer: \"\", urgent: false,\n    photo: null, newBarcode: \"\", scanTarget: \"lookup\",\n    reports: [], camOn: false, canZoom: false, canTorch: false, torch: false, zoom: 2,\n    pin: \"\", pending: null, camMsg: \"要查價時才開相機 —— 按「掃條碼」開始，查到就自動關閉。\",\n    toast: \"\", bossLine: \"\", sheetUrl: \"\", lastSync: \"\", syncing: false,\n    apiUrl: \"\", pulling: false\n  };\n\n  // ---------- 回報同步（Google Sheet「回報」工作表） ----------\n  async apiGet(){\n    const url = this.state.apiUrl; if (!url) return null;\n    try {\n      const r = await fetch(url + (url.indexOf(\"?\") >= 0 ? \"&\" : \"?\") + \"t=\" + Date.now(), {cache: \"no-store\"});\n      const j = await r.json();\n      return j && j.ok ? j.reports : null;\n    } catch (e) { return null; }\n  }\n  // 從 Sheet 的「員工」工作表抓授權名單：名字 | 角色 | 密碼 | 啟用\n  async pullStaff(quiet){\n    const url = this.state.apiUrl; if (!url) return;\n    try {\n      const r = await fetch(url + \"?t=\" + Date.now(), {cache: \"no-store\"});\n      const j = await r.json();\n      if (!j || !j.ok || !Array.isArray(j.staff) || !j.staff.length) return;\n      const list = j.staff.filter(m => m && m.name).map(m => ({\n        id: \"sheet-\" + m.name, name: String(m.name).trim(),\n        role: String(m.role || \"門市\").trim(),\n        pw: String(m.pw == null ? \"\" : m.pw).trim(),\n        on: !(String(m.on == null ? \"Y\" : m.on).trim().toUpperCase() === \"N\")\n      }));\n      const active = list.filter(m => m.on);\n      this.persist(this.KEY_STAFF, active);\n      const me = this.state.me;\n      // 名單上被移除或停用的人，立刻踢回登入畫面\n      if (me && !active.some(m => m.name === me.name)) {\n        this.persist(this.KEY_ME, null);\n        this.stopCam();\n        this.setState({staff: active, me: null, screen: \"login\"});\n        this.flash(\"此帳號已停用，請找老闆\");\n        return;\n      }\n      this.setState({staff: active, staffFromSheet: true});\n      if (!quiet) this.flash(\"已同步 \" + active.length + \" 位員工\");\n    } catch (e) { if (!quiet) this.flash(\"員工名單同步失敗\"); }\n  }\n  async apiPost(payload){\n    const url = this.state.apiUrl; if (!url) return false;\n    try {\n      const r = await fetch(url, {method: \"POST\", body: JSON.stringify(payload),\n        headers: {\"Content-Type\": \"text/plain;charset=utf-8\"},\n        redirect: \"follow\", keepalive: true});\n      const t = await r.text();\n      return t.indexOf('\"ok\":true') >= 0 || t.indexOf(\"ok\") >= 0;\n    } catch (e) {\n      // CORS 或網路問題：改用不看回應的方式再送一次，資料仍會寫進 Sheet\n      try { await fetch(url, {method: \"POST\", mode: \"no-cors\", keepalive: true,\n        body: JSON.stringify(payload), headers: {\"Content-Type\": \"text/plain;charset=utf-8\"}});\n        return true; } catch (e2) { return false; }\n    }\n  }\n  async testApi(){\n    const url = this.state.apiUrl;\n    if (!url) return this.flash(\"沒有同步網址\");\n    this.flash(\"測試中…\");\n    try {\n      const r = await fetch(url + \"?t=\" + Date.now(), {cache: \"no-store\"});\n      const t = await r.text();\n      if (t.indexOf('\"ok\":true') >= 0) {\n        const j = JSON.parse(t);\n        return this.flash(\"連線正常 · Sheet 上有 \" + (j.reports ? j.reports.length : 0) + \" 筆\");\n      }\n      if (t.indexOf(\"<\") === 0) return this.flash(\"權限錯誤：部署要選「誰可以存取：所有人」\");\n      return this.flash(\"回應異常：\" + t.slice(0, 60));\n    } catch (e) {\n      this.flash(\"連不上（\" + (e && e.message ? e.message : \"錯誤\") + \"）\");\n    }\n  }\n  async pullReports(quiet){\n    if (!this.state.apiUrl) return;\n    this.setState({pulling: true});\n    const rows = await this.apiGet();\n    this.setState({pulling: false});\n    if (!rows) { if (!quiet) this.flash(\"回報同步失敗，檢查設定裡的網址\"); return; }\n    const list = rows.map(r => ({id: String(r.id), kind: r.kind, name: r.name, spec: r.spec,\n      qty: r.qty, unit: r.unit, who: r.who, when: r.when, customer: r.customer,\n      code: r.code, barno: r.barno, urgent: !!r.urgent, status: r.status || \"待處理\",\n      photo: null, pid: -1})).reverse();\n    await this.saveReports(list);\n    if (!quiet) this.flash(\"已同步 \" + list.length + \" 筆回報\");\n  }\n\n  // 把使用者貼的 Google Sheet 網址轉成可直接讀的 CSV 網址\n  normalizeSheetUrl(raw){\n    const u = String(raw || \"\").trim();\n    if (!u) return \"\";\n    if (u.indexOf(\"output=csv\") >= 0 || u.indexOf(\"/pub?\") >= 0) return u;\n    const m = u.match(/\\/spreadsheets\\/d\\/([a-zA-Z0-9-_]+)/);\n    if (!m) return u;\n    const g = u.match(/[#&?]gid=([0-9]+)/);\n    return \"https://docs.google.com/spreadsheets/d/\" + m[1] + \"/gviz/tq?tqx=out:csv\" + (g ? \"&gid=\" + g[1] : \"\");\n  }\n\n  async fetchSheet(url, quiet){\n    const target = this.normalizeSheetUrl(url);\n    if (!target) { if (!quiet) this.flash(\"還沒設定 Google Sheet 網址\"); return; }\n    this.setState({syncing: true});\n    if (!quiet) this.flash(\"正在從 Google Sheet 更新…\");\n    try {\n      const r = await fetch(target, {cache: \"no-store\"});\n      if (!r.ok) throw new Error(\"HTTP \" + r.status);\n      const text = await r.text();\n      if (text.indexOf(\"<!DOCTYPE\") === 0 || text.indexOf(\"<HTML\") === 0) throw new Error(\"網址沒有公開發布\");\n      const rows = this.parseCsv(text);\n      if (!rows.length) throw new Error(\"讀不到資料，請確認第一列欄名\");\n      await this.kvPut(\"products\", rows);\n      this.buildIndex(rows);\n      const stamp = new Date().toLocaleString(\"zh-TW\", {month: \"numeric\", day: \"numeric\", hour: \"2-digit\", minute: \"2-digit\"});\n      this.lsPut(this.KEY_SYNC, stamp);\n      this.setState({items: rows, lastSync: stamp, syncing: false,\n        dataSource: \"Google Sheet · \" + stamp + \" 更新\"});\n      if (!quiet) this.flash(\"已更新 \" + rows.length.toLocaleString(\"en-US\") + \" 項\");\n    } catch (e) {\n      this.setState({syncing: false});\n      const msg = e && e.message ? e.message : \"連線失敗\";\n      if (!quiet) this.flash(\"更新失敗：\" + msg);\n      else if (!this.state.items.length) this.flash(\"抓不到 Sheet，先用上次 rts\", list); }\n\n  reportText(r){\n    const it = r.pid >= 0 ? this.find(r.pid) : {n: r.name || \"\", s: r.spec || \"\", u: r.unit || \"\", k: 0, b: r.barno || \"\", e: 0};\n    const L = [];\n    L.push(\"【\" + (r.urgent ? \"急件 \" : \"\") + r.kind + \"】\");\n    L.push(it.n + (it.s && it.s !== \"—\" ? \"  \" + it.s : \"\"));\n    if (r.kind === \"補條碼\") { L.push(\"廠商條碼：\" + (r.code || \"（見照片）\")); }\n    else if (r.kind === \"庫存不符\") { L.push(\"實際盤點：\" + r.qty + \" \" + it.u + \"（帳上 \" + it.k + \"，差 \" + (r.qty - it.k) + \"）\"); }\n    else { L.push(\"數量：\" + r.qty + \" \" + it.u); }\n    if (r.customer) L.push(\"客戶：\" + r.customer);\n    L.push(\"帳上庫存：\" + it.k + \" \" + it.u);\n    if (this.priceOf(it)) L.push(\"售價：NT$ \" + this.money(this.priceOf(it)));\n    if (it.b) L.push(\"自編條碼：\" + it.b);\n    L.push(\"—— \" + r.who + \"  \" + r.when);\n    if (r.photo) L.push(\"（另附照片一張，請看下一則訊息）\");\n    return L.join(\"\\n\");\n  }\n  async send(r){\n    const text = this.reportText(r);\n    if (navigator.share) {\n      try { await navigator.share({title: \"庫存回報\", text: text}); this.flash(\"已送出\"); return; }\n      catch (e) { if (e && e.name === \"AbortError\") return; }\n    }\n    try { await navigator.clipboard.writeText(text); } catch (e) {}\n    const url = \"https://line.me/R/msg/text/?\" + encodeURIComponent(text);\n    const w = window.open(url, \"_blank\");\n    if (!w) location.href = url;\n    this.flash(\"已複製內容，選 LINE 傳給老闆\");\n  }\n\n  async shrinkPhoto(file){\n    const url = URL.createObjectURL(file);\n    try {\n      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });\n      const max = 900, sc = Math.min(1, max / Math.max(img.width, img.height));\n      const c = document.createElement(\"canvas\");\n      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);\n      c.getContext(\"2d\").drawImage(img, 0, 0, c.width, c.height);\n      return c.toDataURL( ff\" + text], {type: \"text/csv;charset=utf-8\"});\n    const a = document.createElement(\"a\");\n    a.href = URL.createObjectURL(blob); a.download = name;\n    document.body.appendChild(a); a.click();\n    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);\n  }\n\n  // ---------- render ----------\n  renderVals(){\n    const s = this.state, thr = this.props.lowStockThreshold ?? 2;\n    const me = s.me || {name: \"—\", role: \"—\"};\n    const roleLabel = me.name + \" · \" + me.role;\n    const isBoss = me.role === \"主管\";\n    const titles = {login: \"選擇身分\", scan: \"掃碼查價\", product: \"查詢結果\", report: \"回報\",\n      search: \"搜尋商品\", inbox: \"待辦回報\", settings: \"設定\", staff: \"員工名單\"};\n\n    const x = this.find(s.pid), pi = this.priceInfo(x), price = pi.v;\n    let warnText = \"\";\n    if (s.pid >= 0) {\n      if (!price) warnText = \"這一項沒有售價，請老闆在電腦端補上。\";\n      else if (x.k < 0) warnText = \"帳上是負數（\" + x.k + \"），代表漏登入庫或重複出貨，報價前請先點料。\";\n      else if (x.k <= 0) warnText = \"沒有現貨。要答應客人請先回報訂貨。\";\n      else if (x.k <= thr) warnText = \"只剩 \" + x.k + \" \" + x.u + \"，快沒了。\";\n    }\n    const view = {name: x.n, spec: x.s || \"—\", unit: x.u,\n      priceText: price ? this.money(price) : \"—\", priceSrc: pi.src, stockText: String(x.k),\n      barno: x.b || \"未建立\", barint: x.v || \"未建檔\",\n      warn: !!warnText, warnText: warnText};\n\n    // 搜尋：英數連在一起算一段，中文逐字一段；每段都要出現，順序不拘，不用空白\n    const tokens = this.tokenize(s.query);\n    let list = s.items;\n    if (tokens.length) {\n      const out = [];\n      for (let i = 0; i < list.length; i++) if (this.matches(list[i], tokens)) out.push(list[i]);\n      list = out;\n    }\n    if (s.filter === \"無現貨\") list = list.filter(r => r.k <= 0);\n    if (s.filter === \"負數\") list = list.filter(r => r.k < 0);\n    if (s.filter === \"無售價\") list = list.filter(r => !this.priceOf(r));\n    const shown = list.slice(0, s.limit);\n    const more = list.length - shown.length;\n\n    // 所有人看到同一份回報清單，才不會重複做同一件事\n    const mine = s.reports;\n    const openR = mine.filter(r => r.status !== \"已處理\");\n\n    return {\n      isBoot: s.boot, bootMsg: s.bootMsg,\n      chromeOn: !s.boot && s.screen !== \"login\",\n      screenTitle: titles[s.screen] || \"\",\n      statusLine: roleLabel + \" · \" + (s.items.length ? s.items.length.toLocaleString(\"en-US\") + \" 項\" : \"無資料\"),\n      roleLabel: roleLabel, toast: s.toast,\n      isLogin: s.screen === \"login\", isScan: s.screen === \"scan\", isProduct: s.screen === \"product\",\n      isReport: s.screen === \"report\", isSearch: s.screen === \"search\", isInbox: s.screen === \"inbox\",\n      isSettings: s.screen === \"settings\", isStaffScreen: s.screen === \"staff\",\n      p: view,\n\n      staff: s.staff.map(m => ({name: m.name, role: m.role,\n        roleLabel: (m.pw || m.role === \"主管\") ? m.role + \" · 需密碼\" : m.role,\n        pick: () => {\n          const need = m.pw || (m.role === \"主管\" ? this.BOSS_PW : \"\");\n          if (need) {\n            const pw = window.prompt(m.name + \" 的密碼\");\n            if (pw === null) return;\n            if (pw.trim() !== need) return this.flash(\"密碼錯誤\");\n          }\n          this.persist(this.KEY_ME, m);\n          this.setState({me: m, screen: \"scan\"}); }})),\n\n      videoRef: this.videoRef, camOff: !s.camOn, camOnNow: s.camOn, camMsg: s.camMsg,\n      startCam: () => this.startCam(),\n      stopCamBtn: () => this.stopCam(),\n      canZoom: s.canZoom, canTorch: s.canTorch,\n      torchLabel: s.torch ? \"關燈\" : \"開燈\",\n      toggleTorch: () => this.toggleTorch(),\n      zoomOut: () => this.setZoom((s.zoom || 2) - 1),\n      zoomIn: () => this.setZoom((s.zoom || 2) + 1),\n      zoomLabel: (Math.round((s.zoom || 2) * 10) / 10) + \"×\",\n      codeInput: s.codeInput,\n      onCodeInput: e => this.setState({codeInput: e.target.value.replace(/[^0-9A-Za-z-]/g, \"\")}),\n      onCodeKey: e => { if (e.key === \"Enter\") { e.preventDefault(); this.submitByCode(); } },\n      submitCode: () => this.submitByCode(),\n      noRecent: !s.recentIds.length,\n      recent: s.recentIds.map(id => { const r = this.find(id); return {\n        name: r.n, spec: r.s || \"—\", priceText: this.priceOf(r) ? \"NT$ \" + this.money(this.priceOf(r)) : \"無價\",\n        stockText: this.chip(r), open: () => this.open(id)}; }),\n\n      goScan: () => this.go(\"scan\"), goSettings: () => this.go(\"settings\"),\n      goStaff: () => this.go(\"staff\"), back: () => this.go(\"product\"),\n      reportOrder: () => this.report(\"需要訂貨\"), reportOwed: () => this.report(\"欠客人\"),\n      reportDiff: () => this.report(\"庫存不符\"), reportBarcode: () => this.report(\"補條碼\"),\n\n      types: [\"需要訂貨\",\"欠客人\",\"庫存不符\",\"補條碼\"].map(l => ({label: l, on: s.reportType === l, off: s.reportType !== l,\n        pick: () => { const cur = this.find(s.pid);\n          this.setState({reportType: l, qty: l === \"庫存不符\" ? Math.max(0, cur.k || 0) : 1}); }})),\n      isQtyReport: s.reportType !== \"補條碼\", isBarcodeReport: s.reportType === \"補條碼\",\n      qtyLabel: s.reportType === \"庫存不符\" ? \"實際盤點數量 · \" + view.unit : \"數量 · \" + view.unit,\n      isCountReport: s.reportType === \"庫存不符\",\n      countHint: \"帳上是 \" + x.k + \" \" + x.u + \"。請數一下架上實際有幾個，填實際數字。\",\n      qtyText: String(s.qty),\n      onQty: e => { const n = parseInt(String(e.target.value).replace(/[^0-9]/g, \"\"), 10); this.setState({qty: isNaN(n) ? 0 : n}); },\n\n      customer: s.customer, onCustomer: e => this.setState({customer: e.target.value}),\n      newBarcode: s.newBarcode,\n      onNewBarcode: e => this.setState({newBarcode: e.target.value.replace(/[^0-9A-Za-z-]/g, \"\")}),\n      scanIntoField: () => { this.setState({scanTarget: \"field\", screen: \"scan\"}, () => this.startCam()); },\n      urgent: s.urgent, notUrgent: !s.urgent,\n      toggleUrgent: () => this.setState(st => ({urgent: !st.urgent})),\n      photoLabel: s.photo ? \"已附照片\" : \"拍照\",\n      hasPhoto: !!s.photo, photoCss: s.photo ? 'url(\"' + s.photo + '\")' : \"none\",\n      onPhoto: async e => { const f = e.target.files && e.target.files[0]; if (!f) return;\n        try { const d = await this.shrinkPhoto(f); this.setState({photo: d}); this.flash(\"照片已附上\"); }\n        catch (err) { this.flash(\"照片讀取失敗\"); } },\n      submitReport: async () => {\n        if (s.pid < 0) return this.flash(\"請先掃一個商品\");\n        const isBc = s.reportType === \"補條碼\";\n        if (isBc && !s.newBarcode.trim() && !s.photo) return this.flash(\"請輸入條碼號或拍照\");\n        if (!isBc && !s.qty) return this.flash(\"數量不能是 0\");\n        const now = new Date();\n        const it = this.find(s.pid);\n        const rec = {id: \"r\" + now.getTime(), kind: s.reportType, pid: s.pid, qty: isBc ? 0 : s.qty,\n          code: isBc ? s.newBarcode.trim() : \"\", photo: s.photo || null, who: roleLabel,\n          when: now.toLocaleString(\"zh-TW\", {month: \"numeric\", day: \"numeric\", hour: \"2-digit\", minute: \"2-digit\"}),\n          customer: s.customer.trim(), urgent: s.urgent, status: \"待處理\",\n          name: it.n, spec: it.s || \"\", unit: it.u, barno: it.b || \"\"};\n        await this.saveReports([rec].concat(s.reports));\n        // 一定要等寫入完成再開 LINE，否則跳離頁面會把請求取消（Sheet 就不會有資料）\n        const wrote = await this.apiPost({action: \"add\", id: rec.id, when: rec.when, who: rec.who,\n          kind: rec.kind, name: rec.name, spec: rec.spec, qty: rec.qty, unit: rec.unit,\n          customer: rec.customer, code: rec.code, barno: rec.barno, urgent: rec.urgent, status: rec.status});\n        if (!wrote) this.flash(\"已存在手機，但 Sheet 寫入失敗 —— 設定裡按「測試連線」看原因\");\n        this.setState({screen: \"inbox\", photo: null, newBarcode: \"\", customer: \"\", qty: 1, urgent: false});\n        this.send(rec);\n      },\n\n      query: s.query, onQuery: e => this.setState({query: e.target.value, limit: 100}),\n      filters: [\"全部\",\"無現貨\",\"負數\",\"無售價\"].map(l => ({label: l, on: s.filter === l, off: s.filter !== l,\n        pick: () => this.setState({filter: l, limit: 100})})),\n      resultCount: tokens.length || s.filter !== \"全部\"\n        ? \"找到 \" + list.length.toLocaleString(\"en-US\") + \" 筆\" + (more > 0 ? \"，已顯示 \" + shown.length : \"\")\n        : \"全部 \" + s.items.length.toLocaleString(\"en-US\") + \" 項，輸入關鍵字搜尋（任意順序、不用空白）\",\n      hasMore: more > 0,\n      moreLabel: \"再顯示 \" + Math.min(more, 200) + \" 筆（還有 \" + more.toLocaleString(\"en-US\") + \" 筆）\",\n      showMore: () => this.setState(st => ({limit: st.limit + 200})),\n      results: shown.map(r => ({name: r.n, spec: r.s || \"—\",\n        priceText: this.priceOf(r) ? \"NT$ \" + this.money(this.priceOf(r)) : \"無價\",\n        stockText: this.chip(r), ok: r.k > thr, bad: r.k <= thr, open: () => this.open(r.id)})),\n\n      statOpen: openR.length, statUrgent: openR.filter(r => r.urgent).length,\n      statDone: mine.filter(r => r.status === \"已處理\").length,\n      noReports: !mine.length, hasReports: !!mine.length && isBoss,\n      reports: mine.map(r => { const it = r.pid >= 0 ? this.find(r.pid) : {n: r.name, s: r.spec, u: r.unit, k: 0, b: r.barno}; return {\n        kindLabel: (r.urgent ? \"急件 · \" : \"\") + r.kind,\n        name: r.name || it.n, spec: (r.spec || it.s) || \"—\", unit: r.unit || it.u, qty: r.qty, who: r.who, when: r.when,\n        isBc: r.kind === \"補條碼\", isQty: r.kind !== \"補條碼\", newCode: r.code || \"（見照片）\",\n        hasPhoto: !!r.photo, photoCss: r.photo ? 'url(\"' + r.photo + '\")' : \"none\",\n        hasCustomer: !!r.customer, customer: r.customer,\n        pending: r.status !== \"已處理\", settled: r.status === \"已處理\",\n        resend: () => this.send(r),\n        done: () => { this.apiPost({action: \"status\", id: r.id, status: \"已處理\"});\n          this.saveReports(s.reports.map(z => z.id === r.id ? Object.assign({}, z, {status: \"已處理\"}) : z)); },\n        remove: () => { this.apiPost({action: \"delete\", id: r.id});\n          this.saveReports(s.reports.filter(z => z.id !== r.id)); this.flash(\"已刪除，Sheet 也同步移除\"); }\n      }; }),\n      exportReports: () => {\n        const q = v => { const t = String(v == null ? \"\" : v); return /[\",\\n]/.test(t) ? '\"' + t.replace(/\"/g, '\"\"') + '\"' : t; };\n        const rows = [\"類型,品名,規格,數量,單位,客戶,回報條碼,自編條碼,回報人,時間,急件,狀態\"];\n        mine.forEach(r => { const it = r.pid >= 0 ? this.find(r.pid) : {n: r.name, s: r.spec, u: r.unit, b: r.barno};\n          rows.push([r.kind, it.n, it.s, r.qty, it.u, r.customer, r.code, it.b, r.who, r.when, r.urgent ? \"急件\" : \"\", r.status].map(q).join(\",\")); });\n        this.download(\"回報清單.csv\", rows.join(\"\\n\"));\n        this.flash(\"已匯出 \" + mine.length + \" 筆\");\n      },\n\n      itemCount: s.items.length.toLocaleString(\"en-US\"), dataSource: s.dataSource,\n      syncLabel: s.syncing ? \"更新中…\" : \"立即更新產品資料\",\n      headerSyncLabel: s.syncing ? \"更新中\" : \"更新資料\",\n      syncNow: () => this.fetchSheet(this.DEFAULT_SHEET, false),\n      onImport: async e => {\n        const f = e.target.files && e.target.files[0]; if (!f) return;\n        this.setState({boot: true, bootMsg: \"解析 \" + f.name + \"…\"});\n        try {\n          const text = await f.text();\n          const rows = this.parseCsv(text);\n          if (!rows.length) { this.setState({boot: false}); return this.flash(\"讀不到資料，請確認欄名有 BARNO 與 NAME\"); }\n          await this.kvPut(\"products\", rows);\n          this.buildIndex(rows);\n          this.setState({items: rows, boot: false, dataSource: f.name + \" · \" + new Date().toLocaleString(\"zh-TW\"), recentIds: [], pid: -1});\n          this.flash(\"已匯入 \" + rows.length.toLocaleString(\"en-US\") + \" 項\");\n        } catch (err) { this.setState({boot: false}); this.flash(\"匯入失敗：\" + (err && err.message ? err.message : \"未知錯誤\")); }\n      },\n\n      canManageStaff: isBoss && !s.staffFromSheet,\n      staffFromSheet: !!s.staffFromSheet,\n      staffCount: s.staff.length + \" 人\",\n      pullStaffNow: () => this.pullStaff(false),\n      staffRows: s.staff.map(m => ({\n        name: m.name, role: m.role,\n        rename: e => { const v = e.target.value;\n          const list = s.staff.map(z => z.id === m.id ? Object.assign({}, z, {name: v}) : z);\n          const nm = s.me && s.me.id === m.id ? Object.assign({}, s.me, {name: v}) : s.me;\n          this.persist(this.KEY_STAFF, list);\n          if (nm !== s.me) this.persist(this.KEY_ME, nm);\n          this.setState({staff: list, me: nm}); },\n        cycleRole: () => { const o = [\"門市\",\"倉管\",\"主管\"], nx = o[(o.indexOf(m.role) + 1) % o.length];\n          const list = s.staff.map(z => z.id === m.id ? Object.assign({}, z, {role: nx}) : z);\n          const nm = s.me && s.me.id === m.id ? Object.assign({}, s.me, {role: nx}) : s.me;\n          this.persist(this.KEY_STAFF, list);\n          if (nm !== s.me) this.persist(this.KEY_ME, nm);\n          this.setState({staff: list, me: nm}); },\n        remove: () => { if (s.staff.length <= 1) return this.flash(\"至少要留一個人\");\n          const list = s.staff.filter(z => z.id !== m.id); this.persist(this.KEY_STAFF, list);\n          const kickMe = s.me && s.me.id === m.id;\n          if (kickMe) this.persist(this.KEY_ME, null);\n          this.setState({staff: list, me: kickMe ? null : s.me, screen: kickMe ? \"login\" : s.screen});\n          this.flash(\"已移除 \" + m.name); }\n      })),\n      newStaffName: s.newStaffName, onNewStaffName: e => this.setState({newStaffName: e.target.value}),\n      newStaffRole: s.newStaffRole,\n      cycleNewRole: () => { const o = [\"門市\",\"倉管\",\"主管\"]; this.setState(st => ({newStaffRole: o[(o.indexOf(st.newStaffRole) + 1) % o.length]})); },\n      addStaff: () => { const nm = s.newStaffName.trim(); if (!nm) return this.flash(\"請輸入名字\");\n        const list = s.staff.concat([{id: \"s\" + Date.now(), name: nm, role: s.newStaffRole}]);\n        this.persist(this.KEY_STAFF, list); this.setState({staff: list, newStaffName: \"\"}); this.flash(\"已新增 \" + nm); },\n\n      bossLineLabel: \"7771159\",\n      apiLabel: s.apiUrl ? \"已連線\" : \"未設定\",\n      apiOn: !!s.apiUrl,\n      pullNow: () => this.pullReports(false),\n      testApiBtn: () => this.testApi(),\n      pullLabel: s.pulling ? \"同步中…\" : \"同步回報清單\",\n      logout: () => { this.stopCam(); this.persist(this.KEY_ME, null); this.setState({me: null, screen: \"login\"}); },\n\n      tabs: [{k: \"scan\", l: \"掃碼\"}, {k: \"search\", l: \"搜尋\"},\n        {k: \"inbox\", l: openR.length ? \"回報 \" + openR.length : \"回報\"}, {k: \"settings\", l: \"設定\"}]\n        .map(t => ({label: t.l, on: s.screen === t.k, off: s.screen !== t.k, go: () => this.go(t.k)}))\n    };\n  }\n\n  submitByCode(){\n    const k = this.state.codeInput.trim();\n    if (!k) return this.flash(\"請輸入條碼\");\n    const id = this.lookup(k);\n    if (id >= 0) { this.setState({codeInput: \"\"}); this.open(id); }\n    else { this.setState({screen: \"search\", query: k, codeInput: \"\"}); this.stopCam(); this.flash(\"條碼查不到，改用文字搜尋\"); }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
